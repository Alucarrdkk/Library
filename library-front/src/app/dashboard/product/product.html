<div class="container-fluid text-center my-4">
  <div class="row g-5 vh-100 p-3">
              <div class="col-12 container text-center">
            <div class="row align-items-center table-title">
                <div class="col col-1 align-middle d-flex align-items-center justify-content-center table-title-element">
                <p class="fs-md-6 fs-lg-5">Image</p>
                </div>
                <div class="col col-1 align-middle d-flex align-items-center justify-content-center table-title-element ">
                <p class="fs-md-6 fs-lg-5">ISBN</p>
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center table-title-element ">
                    <p class="fs-md-6 fs-lg-5">Title</p>
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center table-title-element ">
                    <p class="fs-md-6 fs-lg-5">Author</p>
                </div>
                <div class="col col-5 d-flex align-items-center justify-content-center table-title-element ">
                    <p class="fs-md-6 fs-lg-5">Description</p>
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center table-title-element ">
                    <p class="fs-md-6 fs-lg-5">Price</p>
                </div>
                <div class="col col-2 d-flex align-items-center justify-content-center table-title-element ">
                    <p class="fs-md-6 fs-lg-5">Others</p>
                </div>
            </div>
          </div>
      @for (book of books; track book.isbn) 
      {
          <div class="col-12 container text-center line">
            <div class="row align-items-center line">
                <div class="col col-1 element">
                    <div class="img-container ">
                      <img [src]="imgPath + book.imgPath" class="responsive-img" alt="Not Found">
                    </div>
                </div>
                <div class="col col-1 align-middle d-flex align-items-center justify-content-center element">
                <p class="fs-md-6 fs-lg-5">{{book.isbn}}</p>
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.title}}
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.author}}
                </div>
                <div class="col col-5 frame align-items-center justify-content-center element">
                    {{book.description}}
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.price}}
                </div>
                <div class="col col-2 d-flex align-items-center justify-content-center element">
                    <div class="container">
                        <div class="row g-1">
                            <div class="col-3">
                                <button type="button" class="btn btn-success btn-sm" (click)="openUpdateModal(book)"><i class="bi bi-pencil"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-primary btn-sm" (click)="openSeeModal(book)"><i class="bi bi-eye"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-danger btn-sm" (click)="openDeleteModal(book)"><i class="bi bi-trash3"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning btn-sm"><i class="bi bi-star"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          </div>


          <div class="col-12 container text-center line">
            <div class="row align-items-center line">
                <div class="col col-1 element">
                    <div class="img-container ">
                      <img [src]="imgPath + book.imgPath" class="responsive-img" alt="Not Found">
                    </div>
                </div>
                <div class="col col-1 align-middle d-flex align-items-center justify-content-center element">
                <p class="fs-md-6 fs-lg-5">{{book.isbn}}</p>
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.title}}
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.author}}
                </div>
                <div class="col col-5 frame align-items-center justify-content-center element">
                    {{book.description}}
                </div>
                <div class="col col-1 d-flex align-items-center justify-content-center element">
                    {{book.price}}
                </div>
                <div class="col col-2 d-flex align-items-center justify-content-center element">
                    <div class="container">
                        <div class="row g-1">
                            <div class="col-3">
                                <button type="button" class="btn btn-success" (click)="openUpdateModal(book)"><i class="bi bi-pencil"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-primary" (click)="openSeeModal(book)"><i class="bi bi-eye"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-danger" (click)="openDeleteModal(book)"><i class="bi bi-trash3"></i></button>
                            </div>
                            <div class="col-3">
                                <button type="button" class="btn btn-warning"><i class="bi bi-star"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
          </div>
      }
  </div>
</div>
